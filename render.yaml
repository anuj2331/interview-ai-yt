services:
  # ===================================================
  # Backend Web Service (Node.js + Express + MongoDB)
  # ===================================================
  - type: web
    name: interview-ai-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ===================================================
  # Frontend Static Site (React + Vite SPA)
  # ===================================================
  - type: web
    name: interview-ai-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
